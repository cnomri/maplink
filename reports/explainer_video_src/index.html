<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0b0d10;font-family:Inter,sans-serif;color:#e8ebf0;-webkit-font-smoothing:antialiased}
  #gl,#ov{position:absolute;left:0;top:0;width:1280px;height:720px}
  .abs{position:absolute}
  #step{left:40px;top:30px;font-size:13px;letter-spacing:.16em;font-weight:700;color:#ffb057;text-transform:uppercase;display:none}
  #head{left:40px;top:50px;font-size:28px;font-weight:700;letter-spacing:-.015em;display:none;white-space:nowrap}
  #cap{left:0;right:0;bottom:24px;text-align:center;display:none}
  #cap span{display:inline-block;background:rgba(10,12,16,.82);border:1px solid rgba(255,255,255,.08);padding:10px 20px;border-radius:12px;font-size:19px;font-weight:500;max-width:1060px;line-height:1.35}
  .panel{background:rgba(15,18,24,.94);border:1px solid #262c37;border-radius:12px;box-sizing:border-box}
  #term,#chat{display:none;font-family:'DejaVu Sans Mono',monospace;font-size:13px;line-height:1.62;white-space:pre-wrap;padding:16px 18px;overflow:hidden}
  #prompt{display:none;left:190px;top:104px;width:900px;height:96px;padding:18px 22px;font-size:19px;line-height:1.45}
  #prompt .lbl{font-size:12px;letter-spacing:.14em;color:#8a93a3;font-weight:700;margin-bottom:6px}
  #prompt .btn{position:absolute;right:18px;bottom:16px;background:#ffb057;color:#16120b;font-weight:700;font-size:14px;padding:7px 14px;border-radius:8px}
  #title{display:none;left:70px;top:210px;width:900px}
  #title h1{font-size:64px;line-height:1.02;margin:0 0 18px;letter-spacing:-.03em;font-weight:800}
  #title p{font-size:22px;margin:0;color:#c6ccd6;line-height:1.4;font-weight:500}
  #title .small{margin-top:28px;font-size:14px;color:#8a93a3;letter-spacing:.02em}
  #model{display:none;left:356px;top:232px;width:172px;height:250px;padding:18px 14px;text-align:center}
  #model .t{font-size:17px;font-weight:700;margin-top:10px}
  #model .s{font-size:12.5px;color:#9aa3b2;margin-top:4px;line-height:1.35}
  #model .step{font-family:'DejaVu Sans Mono',monospace;font-size:13px;color:#ffb057;margin-top:18px}
  #promptCard{display:none;left:40px;top:516px;width:288px;height:96px;padding:12px 14px;font-size:13.5px;line-height:1.4;color:#d5dae2}
  #promptCard b{display:block;font-size:11px;letter-spacing:.14em;color:#8a93a3;margin-bottom:4px}
  #iterChat{display:none;left:40px;top:104px;width:1200px;height:48px;padding:12px 18px;font-family:'DejaVu Sans Mono',monospace;font-size:15px}
  #checks{display:none;left:460px;top:410px;width:780px;font-size:17px;line-height:1.9}
  #checks .c{display:inline-block;width:380px}
  #summary{display:none;left:0;top:0;width:1280px;height:720px}
  .card{position:absolute;background:rgba(15,18,24,.9);border:1px solid #2a313d;border-radius:14px;padding:22px 26px;box-sizing:border-box}
  .card h3{margin:0 0 12px;font-size:20px}
  .card li{font-size:17px;line-height:1.75;color:#d7dce4}
  .card ul{margin:0;padding-left:20px}
  .chips{position:absolute;left:0;right:0;text-align:center}
  .chip{display:inline-block;padding:8px 14px;border-radius:999px;background:#171b23;border:1px solid #2f3744;font-size:15px;font-weight:600;margin:0 2px}
  .arrow{color:#5d6675;margin:0 4px}
  #tools{position:absolute;left:120px;right:120px;text-align:center;font-size:15.5px;color:#aab2bf;line-height:1.6}
  #fade{left:0;top:0;width:1280px;height:720px;background:#000;opacity:0;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="step" class="abs"></div>
<div id="head" class="abs"></div>
<div id="term" class="abs panel"></div>
<div id="chat" class="abs panel"></div>
<div id="prompt" class="abs panel"></div>
<div id="title" class="abs"></div>
<div id="model" class="abs panel"></div>
<div id="promptCard" class="abs panel"></div>
<div id="iterChat" class="abs panel"></div>
<div id="checks" class="abs"></div>
<div id="summary" class="abs"></div>
<div id="cap" class="abs"><span></span></div>
<div id="fade" class="abs"></div>
<script type="module" src="./scene.js"></script>
</body>
</html>
